spring.application.name=training-portal

spring.datasource.url=jdbc:postgresql://localhost:5432/training_portal
spring.datasource.username=training_portal_user
spring.datasource.password=${TRAINING_PORTAL_DB_PASSWORD}

spring.jpa.properties.hibernate.default_schema=public
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.default-schema=public
spring.flyway.schemas=public

# HTTP本文・Validation例外・SQL例外詳細をログ/標準エラー応答へ出さない。
spring.mvc.log-request-details=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

training.portal.frontend-origin=${TRAINING_PORTAL_FRONTEND_ORIGIN:http://localhost:3000}
server.servlet.session.timeout=1h
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${TRAINING_PORTAL_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${TRAINING_PORTAL_COOKIE_SAME_SITE:lax}
logging.level.org.springframework.security=OFF
logging.level.org.apache.catalina=INFO

# V3 is approved for test1 only. Keep normal/public startup at V2.
spring.flyway.target=2

# Single-server login admission control. Multiple servers require an atomic shared store.
training.portal.login-limit.account-attempts=${TRAINING_PORTAL_LOGIN_ACCOUNT_ATTEMPTS:8}
training.portal.login-limit.source-attempts=${TRAINING_PORTAL_LOGIN_SOURCE_ATTEMPTS:200}
training.portal.login-limit.account-window-seconds=${TRAINING_PORTAL_LOGIN_ACCOUNT_WINDOW_SECONDS:300}
training.portal.login-limit.source-window-seconds=${TRAINING_PORTAL_LOGIN_SOURCE_WINDOW_SECONDS:60}
training.portal.login-limit.block-seconds=${TRAINING_PORTAL_LOGIN_BLOCK_SECONDS:60}
training.portal.login-limit.max-keys=${TRAINING_PORTAL_LOGIN_MAX_KEYS:10000}
training.portal.login-limit.max-concurrent=${TRAINING_PORTAL_LOGIN_MAX_CONCURRENT:32}
server.forward-headers-strategy=none

# Audit identity key is optional; without it, pseudonyms rotate on process restart. Never commit a real key.
training.portal.audit.hmac-key=${TRAINING_PORTAL_AUDIT_HMAC_KEY:}
training.portal.audit.queue-capacity=${TRAINING_PORTAL_AUDIT_QUEUE_CAPACITY:1024}
training.portal.https-confirmed=${TRAINING_PORTAL_HTTPS_CONFIRMED:false}
training.portal.hsts.max-age-seconds=${TRAINING_PORTAL_HSTS_MAX_AGE_SECONDS:0}
