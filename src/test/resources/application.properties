spring.application.name=training-portal-test
spring.datasource.url=jdbc:postgresql://localhost:5432/training_portal?currentSchema=test1
spring.datasource.username=training_portal_user
spring.datasource.password=${TRAINING_PORTAL_DB_PASSWORD}
spring.flyway.default-schema=test1
spring.flyway.schemas=test1
spring.jpa.properties.hibernate.default_schema=test1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

training.portal.frontend-origin=http://localhost:3000
server.servlet.session.timeout=1h
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
logging.level.org.springframework.security=OFF
logging.level.org.apache.catalina=INFO

# Override the public safety cap: tests migrate test1 only.
spring.flyway.target=latest
